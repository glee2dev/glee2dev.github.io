<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero A3 — many lines, one silhouette</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0A0E17}
.hero{position:relative;overflow:hidden;height:100vh;min-height:640px;max-height:820px;display:flex;align-items:flex-end;background:#0A0E17;color:#E6EDF3}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:2;padding:0 clamp(18px,4vw,44px) 56px;max-width:1080px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(40px,7.2vw,96px);font-weight:600;letter-spacing:-.035em;line-height:.95;margin:0}
.hero .kr{font-size:17px;margin:14px 0 0;letter-spacing:.02em;opacity:.65}
.hero .lede{font-size:clamp(19px,2.2vw,26px);max-width:30ch;margin:30px 0 0;line-height:1.3} .hero .lede b{font-weight:600;color:#BFE9FF}
</style></head><body>
<section class="hero">
<svg id="v" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".3"/><stop offset=".06" stop-color="#7DD3FC"/><stop offset=".5" stop-color="#DDF6FF"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="form" transform="translate(-30,-215)">
  <g id="strokes" fill="none" stroke="#9BC5DD" stroke-width="1.2" stroke-linecap="round"></g>
  <path id="line" fill="none" stroke="url(#lg)" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)" opacity="0"/>
</g>
</svg>
<div class="wrap"><h1>Gyunpyo Lee</h1><p class="kr">이건표 · Seoul · data scientist and AI engineer, trained as a car designer</p><p class="lede">I design AI products and <b>measure whether they work</b>.</p></div>
</section>
<script>
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
// the silhouette: mid-engine, cab-forward — low nose, fast screen, peak over the front seats, long tail over the haunch
const ROOF=[[200,506],[300,500,420,486,520,458],[590,440,650,352,770,338],[830,331,880,334,940,346],[1080,368,1250,398,1360,440],[1410,462,1440,486,1428,508]];
const flat=P=>P.flat();                       // 2 + 5*6 = 32 numbers
const toD=v=>`M ${v[0]} ${v[1]} `+[2,8,14,20,26].map(i=>`C ${v.slice(i,i+6).join(" ")}`).join(' ');
const CX=814, CY=430;                         // pivot for the wild versions
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647-.5;

// each stroke starts as its own line: rotated, scaled, shifted, and bent — then morphs into the roofline
const N=14, strokes=[], target=flat(ROOF);
const g=$('strokes');
for(let k=0;k<N;k++){
  const ang=rnd()*0.9, sc=1+rnd()*0.55, dx=rnd()*520, dy=rnd()*300, bend=rnd()*260;
  const c=Math.cos(ang), s=Math.sin(ang), start=[];
  for(let i=0;i<32;i+=2){
    let x=target[i]-CX, y=target[i+1]-CY;
    y+= bend*Math.sin((x/1200)*Math.PI);                              // a different curvature per stroke
    const rx=(x*c-y*s)*sc+CX+dx, ry=(x*s+y*c)*sc+CY+dy;
    start.push(rx+rnd()*14, ry+rnd()*14);
  }
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',toD(start)); p.setAttribute('stroke-opacity','0'); p.setAttribute('pathLength','1'); p.setAttribute('stroke-dasharray','1'); p.setAttribute('stroke-dashoffset','1');
  g.appendChild(p);
  strokes.push({p,start,delay:k*110,dur:2600+rnd()*600});
}
const line=$('line'); line.setAttribute('d',toD(target));

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){ g.remove(); line.style.opacity=1; }
else{
  const ease=t=>1-Math.pow(1-t,3);
  const T0=performance.now()+300;
  // phase 1: draw each stroke along its own path (0–1.4s, staggered)
  strokes.forEach(({p,delay})=>{ p.style.transition='stroke-dashoffset 1.3s ease-out, stroke-opacity .5s ease'; setTimeout(()=>{p.style.strokeDashoffset=0;p.setAttribute('stroke-opacity','.30');},delay); });
  // phase 2: morph every stroke into the silhouette (1.4s–4.6s), converging; the glow line arrives as they meet
  const MSTART=1500;
  function frame(now){
    const t=now-T0; let done=true;
    for(const st of strokes){
      let u=(t-MSTART-st.delay)/st.dur; if(u<0){done=false;continue;} if(u>1)u=1; else done=false;
      const e=ease(u), v=new Array(32);
      for(let i=0;i<32;i++) v[i]=st.start[i]+(target[i]-st.start[i])*e;
      st.p.setAttribute('d',toD(v));
      st.p.setAttribute('stroke-opacity',(0.30+0.5*e).toFixed(3));                 // brighter as they agree
    }
    // the resolved line fades up over the last third of the morph
    const lu=Math.max(0,Math.min(1,(t-MSTART-2200)/1400)); line.style.opacity=lu;
    if(lu>0) strokes.forEach(st=>st.p.setAttribute('stroke-opacity',(0.8*(1-lu)+0.08).toFixed(3)));   // and the strokes step back
    if(!done||lu<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const lg=$('lg'); addEventListener('pointermove',e=>{lg.setAttribute('gradientTransform',`translate(${((e.clientX/innerWidth-.5)*.7).toFixed(3)} 0)`);},{passive:true});
}
</script></body></html>
