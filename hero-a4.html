<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero A4 — many lines, one refined silhouette</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0A0E17}
.hero{position:relative;overflow:hidden;height:100vh;min-height:640px;max-height:820px;display:flex;align-items:flex-end;background:#0A0E17;color:#E6EDF3}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:2;padding:0 clamp(18px,4vw,44px) 56px;max-width:1080px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(40px,7.2vw,96px);font-weight:600;letter-spacing:-.035em;line-height:.95;margin:0}
.hero .kr{font-size:17px;margin:14px 0 0;letter-spacing:.02em;opacity:.65}
.hero .lede{font-size:clamp(19px,2.2vw,26px);max-width:30ch;margin:30px 0 0;line-height:1.3} .hero .lede b{font-weight:600;color:#BFE9FF}
</style></head><body>
<section class="hero">
<svg id="v" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#7DD3FC" stop-opacity=".35"/><stop offset=".08" stop-color="#7DD3FC"/><stop offset=".5" stop-color="#DDF6FF"/><stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="form" transform="translate(56,-236)">
  <g id="strokes" fill="none" stroke="#9BC5DD" stroke-width="1.2" stroke-linecap="round"></g>
  <path id="line" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</g>
</svg>
<div class="wrap"><h1>Gyunpyo Lee</h1><p class="kr">이건표 · Seoul · data scientist and AI engineer, trained as a car designer</p><p class="lede">I design AI products and <b>measure whether they work</b>.</p></div>
</section>
<script>
const NS='http://www.w3.org/2000/svg', $=id=>document.getElementById(id);
// upper curve — the gesture: nose, hood, fast screen, peak over the front seats, long deck over the haunch
const TOP=[214,484, 300,476,420,464,520,446, 600,422,660,348,770,336, 830,330,900,334,1000,348, 1180,370,1300,406,1410,450];
// the refined silhouette: the gesture continued down the tail, along the rocker, over both arches, up the nose
const FULL=[...TOP,
  1436,466,1446,492,1438,514,        // kamm tail, down
  1424,540,1366,554,1296,556,        // tail underside to rear arch
  1280,490,1156,490,1140,556,        // rear wheel arch — crown stays under the body line
  900,566,520,566,400,560,           // rocker, slight rake
  386,492,258,492,242,558,           // front wheel arch
  228,558,216,554,208,546,           // splitter, short
  194,522,196,498,214,484];          // nose, up, closes
const toD=v=>{let d=`M ${v[0]} ${v[1]}`;for(let i=2;i<v.length;i+=6)d+=` C ${v.slice(i,i+6).join(' ')}`;return d;};
const CX=814, CY=420; let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647-.5;

// strokes from many angles: transformed copies of the gesture, each with its own bend
const N=14, strokes=[], g=$('strokes');
for(let k=0;k<N;k++){
  const ang=rnd()*0.9, sc=1+rnd()*0.55, dx=rnd()*520, dy=rnd()*300, bend=rnd()*260, c=Math.cos(ang), s=Math.sin(ang), start=[];
  for(let i=0;i<TOP.length;i+=2){ let x=TOP[i]-CX, y=TOP[i+1]-CY; y+=bend*Math.sin((x/1200)*Math.PI); start.push((x*c-y*s)*sc+CX+dx+rnd()*14,(x*s+y*c)*sc+CY+dy+rnd()*14); }
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',toD(start)); p.setAttribute('stroke-opacity','0'); p.setAttribute('pathLength','1'); p.setAttribute('stroke-dasharray','1'); p.setAttribute('stroke-dashoffset','1');
  g.appendChild(p); strokes.push({p,start,delay:k*100,dur:2200+rnd()*500});
}
const line=$('line'); line.setAttribute('d',toD(FULL)+' Z'); line.setAttribute('pathLength','1'); line.setAttribute('stroke-dasharray','1'); line.setAttribute('stroke-dashoffset','1');

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){ g.remove(); line.style.strokeDashoffset=0; }
else{
  const ease=t=>1-Math.pow(1-t,3), T0=performance.now()+300, MSTART=1300, LSTART=MSTART+1700;
  strokes.forEach(({p,delay})=>{ p.style.transition='stroke-dashoffset 1.2s ease-out, stroke-opacity .5s ease'; setTimeout(()=>{p.style.strokeDashoffset=0;p.setAttribute('stroke-opacity','.30');},delay); });
  line.style.transition='stroke-dashoffset 3s cubic-bezier(.35,.5,.2,1)';
  setTimeout(()=>{ line.style.strokeDashoffset=0; }, LSTART+300);    // the silhouette completes itself, starting where the strokes met
  function frame(now){
    const t=now-T0; let done=true;
    for(const st of strokes){
      let u=(t-MSTART-st.delay)/st.dur; if(u<0){done=false;continue;} if(u>1)u=1; else done=false;
      const e=ease(u), v=new Array(TOP.length); for(let i=0;i<TOP.length;i++) v[i]=st.start[i]+(TOP[i]-st.start[i])*e;
      st.p.setAttribute('d',toD(v)); st.p.setAttribute('stroke-opacity',(0.30+0.5*e).toFixed(3));
    }
    const fade=Math.max(0,Math.min(1,(t-LSTART-600)/1600));                 // strokes step back as the line takes over
    if(fade>0) strokes.forEach(st=>st.p.setAttribute('stroke-opacity',(0.8*(1-fade)+0.06).toFixed(3)));
    if(!done||fade<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const lg=$('lg'); addEventListener('pointermove',e=>{lg.setAttribute('gradientTransform',`translate(${((e.clientX/innerWidth-.5)*.7).toFixed(3)} 0)`);},{passive:true});
}
</script></body></html>
