function remap(x,a0,a1,a2,a3,b0,b1,b2,b3){ if(x<=a1) return b0+(x-a0)*(b1-b0)/Math.max(1e-6,a1-a0); if(x<=a2) return b1+(x-a1)*(b2-b1)/Math.max(1e-6,a2-a1); return b2+(x-a2)*(b3-b2)/Math.max(1e-6,a3-a2); }

function silhouette(d,p,form,keyA,keyB,t){
  let T=tracedTop(keyA,d);
  if(keyB&&keyB!==keyA&&t>0){ const B=OUTLINES[keyB].top.map(([x,y])=>[x,y]); const A=OUTLINES[keyA].top; T=A.map((q,i)=>[lerp(q[0],B[i][0],t),lerp(q[1],B[i][1],t)]); }
  const L=d.L, rh=Math.max(0.12,d.rh), fa=d.fa, ra=d.ra, R=d.R;
  const arcs=[ra,fa].map(cx=>{const o=[]; for(let k=0;k<=16;k++){const a=Math.PI*(1-k/16); o.push([cx+Math.cos(a)*R, 0.5+Math.sin(a)*R]);} return o;});
  const xe=T[T.length-1][0], xs=T[0][0];
  let bot=[[xe,rh+0.12],[xe-0.06,rh],[ra+R,rh],[ra+R,0.5]]; bot=bot.concat(arcs[0].reverse()); bot.push([ra-R,rh],[fa+R,rh],[fa+R,0.5]); bot=bot.concat(arcs[1].reverse()); bot.push([fa-R,rh],[xs+0.06,rh],[xs,rh+0.12]);
  return {top:T, bot, roofAt:x=>{ let i=T.findIndex(q=>q[0]>=x); if(i<=0) i=1; if(i>=T.length) i=T.length-1; const [x0,y0]=T[i-1],[x1,y1]=T[i]; return y0+(y1-y0)*((x-x0)/Math.max(1e-6,x1-x0)); }};
}
function fillet(pts){
  const out=[pts[0].slice(0,2)];
  for(let i=1;i<pts.length-1;i++){
    const [x,y,r]=pts[i], [x0,y0]=pts[i-1], [x1,y1]=pts[i+1]; if(!r){out.push([x,y]);continue;}
    const v0=[x0-x,y0-y], v1=[x1-x,y1-y], l0=Math.hypot(...v0), l1=Math.hypot(...v1); const u0=[v0[0]/l0,v0[1]/l0], u1=[v1[0]/l1,v1[1]/l1];
    const cosA=u0[0]*u1[0]+u0[1]*u1[1], ang=Math.acos(Math.max(-1,Math.min(1,cosA))); const t=Math.min(r/Math.tan(ang/2), l0*0.48, l1*0.48);
    const p0=[x+u0[0]*t,y+u0[1]*t], p1=[x+u1[0]*t,y+u1[1]*t];
    for(let k=0;k<=8;k++){ const q=k/8; const a=(1-q)*(1-q), bq=2*(1-q)*q, c=q*q; out.push([a*p0[0]+bq*x+c*p1[0], a*p0[1]+bq*y+c*p1[1]]); }
  }
  out.push(pts[pts.length-1].slice(0,2)); return out;
}
function dlo(d,p,form,roofAt){
  const L=d.L, roofH=d.roofH, cowlX=d.cowlX, cowlY=d.cowlY, aRun=(roofH-cowlY)/Math.tan(p.aPillarAngle*RAD), belt=d.belt; const rail=x=>(roofAt?roofAt(x):roofH)-0.11; const yt=roofH-0.11;
  const aW=d.aW, cW=Math.max(0.12,d.cW);
  // A line, offset by the pillar width; rear line per form
  const xa=y=>cowlX+aRun*((y-cowlY)/(roofH-cowlY))+aW/Math.sin(p.aPillarAngle*RAD);
  let rear;                                    // rear boundary as a function of y (belt..rail)
  const cRun=(roofH-d.beltDeck)/Math.tan(Math.max(20,p.cPillarAngle)*RAD);
  if(form==='wagon'||form==='mpv') rear=y=>L-0.38-cW*0.3-(roofH-y)*0.10;
  else if(form==='hatch'){ const re=Math.min(L-0.35, Math.max(cowlX+aRun+1.4, d.roofEndX)); rear=y=>re-cW+ (roofH-y)*((L-0.04-re)/(roofH-(d.beltDeck)))*0.9; }
  else if(form==='pickup'){ let cabBack=cowlX+aRun+1.0; if(roofAt){ for(let x=cowlX+aRun+0.4;x<L;x+=0.02){ if(roofAt(x)<roofH-0.45){cabBack=x;break;} } } rear=y=>cabBack-cW*0.7; }
  else if(form==='sports'){ rear=y=>Math.max(cowlX+aRun+1.0, L-2.0)-cW*0.3+(roofH-y)*1.6; }
  else { const re=Math.min(L-cRun-0.5, Math.max(cowlX+aRun+1.2, d.roofEndX)); rear=y=>re-cW+(roofH-y)*(cRun/(roofH-d.beltDeck))*0.9; }
  const n=20, yb=x=>belt(x), pts=[]; const xA0=xa(yb(cowlX+0.3)+0.02), xC0=rear(yb(L-0.8)+0.02);
  for(let i=0;i<=n;i++){ const x=xA0+(xC0-xA0)*i/n; pts.push([x,yb(x)+0.02]); }
  for(let i=1;i<=n;i++){ const y=yb(xC0)+0.02+(yt-yb(xC0)-0.02)*i/n; pts.push([rear(y),y]); }
  for(let i=1;i<n;i++){ const x=rear(yt)+(xa(yt)-rear(yt))*i/n; pts.push([x, Math.min(yt, rail(x))]); }
  for(let i=n;i>=1;i--){ const y=yb(xA0)+0.02+(yt-yb(xA0)-0.02)*i/n; pts.push([xa(y),y]); }
  const ok=pts.filter(q=>!roofAt || roofAt(q[0])-0.11>belt(q[0])+0.12);
  return fillet((ok.length>8?ok:pts).map((q,i)=>[q[0],q[1],(i%n===0)?0.16:0]));
}
function shoulderLine(d){ const L=d.L,n=160,pts=[]; for(let i=0;i<=n;i++){const x=L*i/n; pts.push([x,d.belt(x)]);} return pts; }

/* ── svg drawing ───────────────────────────────────────────────────────── */
const SC=118, X0=60, Y0=345;          // 1 T = 118 px; ground at y=345
const sx=x=>X0+x*SC, sy=y=>Y0-y*SC;
const path=pts=>pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
const el=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
const svg=$('#v');
function draw(d,opts={}){
  const form=formOf(cur||morphTo,P);
  const g=el('g',{}); svg.replaceChildren(g);
  const dimc=r=>activeRegions.length? (activeRegions.includes(r)?1:0.18) : 1;
  // grid: 1 T
  if(show.grid){ const gg=el('g',{stroke:'#26262b','stroke-width':1}); for(let x=0;x<=8;x++) gg.appendChild(el('line',{x1:sx(x),y1:sy(0),x2:sx(x),y2:sy(2.6)})); for(let y=0;y<=2.6;y+=1) gg.appendChild(el('line',{x1:sx(0),y1:sy(y),x2:sx(8),y2:sy(y)})); g.appendChild(gg); }
  g.appendChild(el('line',{x1:sx(-0.3),y1:sy(0),x2:sx(8.3),y2:sy(0),stroke:'#3a3a40','stroke-width':1.2}));
  // ghost: another preset behind, faint
  if(show.ghost&&ghostKey){ const gp=resolve(Object.assign({},PRESETS[ghostKey])), gd=derive(gp); const pr=silhouette(gd,gp,formOf(ghostKey,gp),ghostKey,null,0); g.appendChild(el('path',{d:path(pr.top)+' '+path(pr.bot).replace('M','L')+' Z',fill:'none',stroke:'#F2C069','stroke-opacity':.28,'stroke-width':1.2,'stroke-dasharray':'4 4'})); }
  // wheels
  for(const cx of [d.fa,d.ra]){ g.appendChild(el('circle',{cx:sx(cx),cy:sy(0.5),r:0.5*SC,fill:'#151517',stroke:RC[5],'stroke-opacity':dimc(5),'stroke-width':1.6}));
    g.appendChild(el('circle',{cx:sx(cx),cy:sy(0.5),r:d.rim/2*SC,fill:'none',stroke:RC[4],'stroke-opacity':dimc(4),'stroke-width':1.2}));
    for(let k=0;k<5;k++){const a=k/5*Math.PI*2; g.appendChild(el('line',{x1:sx(cx),y1:sy(0.5),x2:sx(cx)+Math.cos(a)*d.rim/2*SC*0.9,y2:sy(0.5)-Math.sin(a)*d.rim/2*SC*0.9,stroke:RC[4],'stroke-opacity':dimc(4)*0.5,'stroke-width':1}));} }
  // body: one line
  const pr=silhouette(d,P,form,cur||morphFrom,morphTo,morphT); const body=el('path',{d:path(pr.top)+' '+path(pr.bot).replace('M','L')+' Z',fill:'#17181B',stroke:RC[0],'stroke-opacity':Math.max(dimc(0),dimc(1)),'stroke-width':2.2,'stroke-linejoin':'round',id:'bodyline'}); g.appendChild(body);
  
  const dl=dlo(d,P,form,pr.roofAt); g.appendChild(el('path',{d:path(dl)+' Z',fill:RC[3],'fill-opacity':0.10*dimc(3),stroke:RC[3],'stroke-opacity':dimc(3),'stroke-width':1.3}));
  // boxes: the six GP22 features
  if(show.boxes){
    const bx=(x0,x1,y0,y1,r,label)=>{ const bb=el('g',{opacity:dimc(r)}); bb.appendChild(el('rect',{x:sx(x0),y:sy(y1),width:(x1-x0)*SC,height:(y1-y0)*SC,fill:'none',stroke:RC[r],'stroke-width':1,'stroke-dasharray':'5 4','stroke-opacity':.85}));
      bb.appendChild(el('text',{x:sx(x0)+4,y:sy(y1)-5,fill:RC[r],'font-size':11,'letter-spacing':'.05em'},label+'  '+((x1-x0).toFixed(2))+' × '+((y1-y0).toFixed(2))+' T')); g.appendChild(bb); };
    bx(0,d.L,0,d.roofH,0,'BODY'); bx(d.fa-d.R,d.ra+d.R,d.rh,d.belt((d.fa+d.ra)/2),1,'BODYSIDE'); { const xs=dl.map(q=>q[0]); bx(d.cowlX-0.05,Math.max(...xs)+0.12,d.belt(d.cowlX+0.4),d.roofH,2,'CABIN'); }
    const xs=dl.map(p=>p[0]),ys=dl.map(p=>p[1]); bx(Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys),3,'DLO');
    bx(d.fa-d.rim/2,d.fa+d.rim/2,0.5-d.rim/2,0.5+d.rim/2,4,'WHEEL'); bx(d.ra-0.5,d.ra+0.5,0,1,5,'TIRE');
  }
  // dimensions in T
  const dim=(x0,x1,y,label,r)=>{ const dd=el('g',{opacity:dimc(r)}); dd.appendChild(el('line',{x1:sx(x0),y1:sy(y),x2:sx(x1),y2:sy(y),stroke:RC[r],'stroke-width':1})); for(const x of [x0,x1]) dd.appendChild(el('line',{x1:sx(x),y1:sy(y)-5,x2:sx(x),y2:sy(y)+5,stroke:RC[r],'stroke-width':1})); dd.appendChild(el('text',{x:sx((x0+x1)/2),y:sy(y)-6,'text-anchor':'middle',fill:RC[r],'font-size':11},label)); g.appendChild(dd); };
  dim(0,d.L,-0.28,'L = '+d.L.toFixed(2)+' T',0); dim(d.fa,d.ra,-0.16,'wheelbase '+(d.ra-d.fa).toFixed(2)+' T',5); dim(0,d.fa,-0.16,(d.fa).toFixed(2),0); dim(d.ra,d.L,-0.16,(d.L-d.ra).toFixed(2),0);
  const vd=(x,y0,y1,label,r)=>{const dd=el('g',{opacity:dimc(r)}); dd.appendChild(el('line',{x1:sx(x),y1:sy(y0),x2:sx(x),y2:sy(y1),stroke:RC[r],'stroke-width':1})); dd.appendChild(el('text',{x:sx(x)+6,y:sy((y0+y1)/2)+4,fill:RC[r],'font-size':11},label)); g.appendChild(dd);};
  vd(d.L+0.25,0,d.roofH,'H = '+d.roofH.toFixed(2)+' T',0); vd(d.fa,0,1,'T = 1',5);
  if(opts.drawOn){ const len=body.getTotalLength(); body.style.strokeDasharray=len; body.style.strokeDashoffset=len; (window.anime? anime({targets:body,strokeDashoffset:[len,0],duration:1600,easing:'easeInOutCubic'}) : (body.style.transition='stroke-dashoffset 1.6s ease',requestAnimationFrame(()=>body.style.strokeDashoffset=0))); }
}

/* ── parameter panel ───────────────────────────────────────────────────── */

function buildPanel(){
  const root=$('#params'); root.replaceChildren();
  let lastG=null;
  DEFS.forEach(([k,label,gi,min,max,step])=>{ if(gi!==lastG){ root.appendChild(Object.assign(document.createElement('div'),{className:'grp',textContent:gi})); lastG=gi; }
    const row=document.createElement('div'); row.className='row'; row.dataset.k=k; row.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step||0.01}" value="${P[k]}"><b>${fmtV(k,P[k])}</b>`;
    row.querySelector('input').addEventListener('input',e=>{ setParam(P,k,parseFloat(e.target.value)); D=derive(P); row.querySelector('b').textContent=fmtV(k,P[k]); draw(D); $('#who').textContent=(cur? PRESETS[cur].name : 'custom')+' · T = '+Math.round(P.tireOD||0)+' mm'; cur=null; });
    root.appendChild(row); });
}
const fmtV=(k,v)=>/angle/i.test(k)? v.toFixed(1)+'°' : (v.toFixed(2));
function syncPanel(){ document.querySelectorAll('.row').forEach(r=>{ const k=r.dataset.k; r.querySelector('input').value=P[k]; r.querySelector('b').textContent=fmtV(k,P[k]); const ch=CHAPTERS[chapter]; r.classList.toggle('on', show.tour && ch && ch.unlocked.includes(k)); }); }

/* ── presets, morph, transitions ───────────────────────────────────────── */
function goPreset(key,animate=true){
  const target=resolve(Object.assign({},PRESETS[key])); morphFrom=key; morphT=0; cur=key; $('#who').textContent=PRESETS[key].name+' · T = '+Math.round(target.tireOD||0)+' mm';
  document.querySelectorAll('.seg').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===key));
  const from=Object.assign({},P);
  const apply=t=>{ P=lerpParams(from,target,t); D=derive(P); draw(D); syncPanel(); };
  cur=key;
  if(!animate||!window.anime){ apply(1); return; }
  if(tween.a) tween.a.pause(); const o={t:0}; tween.a=anime({targets:o,t:1,duration:700,easing:'easeInOutCubic',update:()=>apply(o.t)});
}
function buildFooter(){
  const f=$('#foot'); f.replaceChildren();
  SEG_ORDER.forEach(k=>{ const b=document.createElement('button'); b.className='seg'; b.dataset.k=k; b.setAttribute('aria-pressed',k===cur); b.innerHTML=`<b>${SEG_LETTER(k)}</b><small>${(OUTLINES[k]?OUTLINES[k].name:PRESETS[k].name).replace(/^(Hyundai) /,'').replace(/^(VW|BMW|Mercedes|Ford|Kia|Fiat|Porsche|Range) /,'')}</small>`; b.title=PRESETS[k].name+' · '+SEG_NAMES[k]; b.onclick=()=>goPreset(k); f.appendChild(b); });
  const m=document.createElement('div'); m.className='morph'; m.innerHTML=`Morph to <select id="mto">${SEG_ORDER.map(k=>`<option value="${k}" ${k===morphTo?'selected':''}>${SEG_LETTER(k)} · ${PRESETS[k].name}</option>`).join('')}</select><input type="range" id="mt" min="0" max="1" step="0.01" value="0"><span id="mv">0%</span>`; f.appendChild(m);
  $('#mto').onchange=e=>{morphTo=e.target.value; $('#mt').value=0; $('#mv').textContent='0%';};
  $('#mt').oninput=e=>{ const t=parseFloat(e.target.value); if(cur) morphFrom=cur; const a=resolve(Object.assign({},PRESETS[morphFrom])), b=resolve(Object.assign({},PRESETS[morphTo])); morphT=t; P=lerpParams(a,b,t); D=derive(P); cur=null; draw(D); syncPanel(); $('#mv').textContent=Math.round(t*100)+'%'; };
}

/* ── tour ──────────────────────────────────────────────────────────────── */
function renderTour(){
  const t=$('#tour'); if(!show.tour){ t.innerHTML='<p style="color:var(--muted)">Explore freely. Drag any slider; every length updates in T.</p>'; activeRegions=[]; syncPanel(); return; }
  const ch=CHAPTERS[chapter]; activeRegions=ch.regions||[];
  t.innerHTML=`<div class="who">Guided tour · ${chapter+1} / ${CHAPTERS.length}</div><h3>${ch.title}</h3><p>${ch.cap}</p><div class="legend">${(ch.regions||[]).map(r=>`<span><i style="background:${RC[r]}"></i>${REGION_NAMES[r]}</span>`).join('')}</div><div class="dots">${CHAPTERS.map((_,i)=>`<i class="${i<=chapter?'on':''}"></i>`).join('')}</div><div class="nav"><button id="t-prev">Previous</button><button id="t-next">Next</button><button class="free" id="t-free">Explore freely</button></div>`;
  $('#t-prev').onclick=()=>{chapter=Math.max(0,chapter-1);renderTour();draw(D);}; $('#t-next').onclick=()=>{chapter=Math.min(CHAPTERS.length-1,chapter+1);renderTour();draw(D);}; $('#t-free').onclick=()=>{show.tour=false;$('#b-tour').setAttribute('aria-pressed',false);renderTour();draw(D);};
  syncPanel();
}

/* ── header controls ───────────────────────────────────────────────────── */
const toggle=(id,key)=>{ $(id).onclick=()=>{ show[key]=!show[key]; $(id).setAttribute('aria-pressed',show[key]); if(key==='tour') renderTour(); draw(D); }; };
toggle('#b-grid','grid'); toggle('#b-boxes','boxes'); toggle('#b-tour','tour');
$('#b-ghost').onclick=()=>{ show.ghost=!show.ghost; if(show.ghost) ghostKey=morphTo; $('#b-ghost').setAttribute('aria-pressed',show.ghost); draw(D); };
$('#b-svg').onclick=()=>{ const s=new XMLSerializer().serializeToString(svg); const b=new Blob([s.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" style="background:#0E0E10"')],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`proportion-${cur||'custom'}.svg`; a.click(); };
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'&&show.tour){$('#t-next')?.click();} if(e.key==='ArrowLeft'&&show.tour){$('#t-prev')?.click();} });

/* ── boot ──────────────────────────────────────────────────────────────── */
buildPanel(); buildFooter(); $('#who').textContent=PRESETS.D.name+' · T = '+Math.round(P.tireOD||0)+' mm'; renderTour(); draw(D,{drawOn:true});
</script></body></html>
